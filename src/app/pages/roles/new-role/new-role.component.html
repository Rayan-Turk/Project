<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>{{ isEditing ? "Edit Role" : "Add New Role" }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="roleName">Role Name</label>
        <input
          id="roleName"
          type="text"
          formControlName="roleName"
          placeholder="Enter role name"
        />
        @if (form.controls.roleName.invalid && form.controls.roleName.touched) {
          <span class="error">Role name is required</span>
        }
      </div>

      <div class="permissions-grid">
        @for (permission of allPermissions; track permission.id) {
          <label class="permission-checkbox">
            <input
              type="checkbox"
              [checked]="isChecked(permission.id)"
              (change)="
                togglePermission(permission.id, $any($event.target).checked)
              "
            />
            {{ permission.moduleName }} — {{ permission.action }}
          </label>
        }
      </div>

      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="onClose()">
          Cancel
        </button>
        <button type="submit" class="submit-btn">
          {{ isEditing ? "Update Role" : "Add Role" }}
        </button>
      </div>
    </form>
  </div>
</div>
