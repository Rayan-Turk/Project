<div class="login-page">
  <div class="login-card">
    <div class="login-card__brand">
      <div class="login-card__logo"></div>
      <span class="login-card__brand-name">Modernize</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="user">User</label>
        <input id="user" formControlName="userName" />
        @if (form.controls.userName.invalid && form.controls.userName.touched) {
          <span class="error">Enter a valid user name</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="error">Password must be at least 6 characters</span>
        }
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    @if (errorMessage) {
      <p class="error login-error">{{ errorMessage }}</p>
    }
  </div>
</div>
